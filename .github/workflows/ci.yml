name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Syntax check every server file
        run: |
          set -e
          for f in server.js db/*.js db/migrations/*.js middleware/*.js routes/*.js services/*.js scripts/*.js; do
            node --check "$f"
          done

      - name: Audit, critical fails the build
        run: npm audit --audit-level=critical

      - name: Audit, high fails the build
        run: npm audit --audit-level=high
